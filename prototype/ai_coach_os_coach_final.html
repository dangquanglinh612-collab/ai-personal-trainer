<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #76d9a8;outline-offset:2px}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(155deg,#1d2a2d,#314a45 55%,#d6ece3)}.login-card{width:min(100%,1020px);min-height:590px;display:grid;grid-template-columns:1.1fr .9fr;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.17)}.login-visual{padding:42px;color:white;display:flex;flex-direction:column;justify-content:space-between}.login-visual h1{font-size:clamp(36px,5vw,54px);line-height:1.06}.login-visual p{line-height:1.8;max-width:420px;color:#e6f2ec}.login-panel{background:white;padding:42px;display:flex;flex-direction:column;justify-content:center}.login-panel h2{font-size:29px;margin:0 0 6px}.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chiprow span{font-size:12px;font-weight:700;border-radius:99px;padding:8px 11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2)}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;z-index:10}.brand{padding:0 12px 22px}.brand h2{margin:0;font-size:20px}.brand small{color:var(--muted);font-size:11px}.coach-badge{background:var(--soft);border-radius:15px;padding:14px;margin-bottom:14px}.coach-badge strong,.coach-badge small{display:block}.coach-badge small{color:var(--dark);margin-top:5px}.nav{display:grid;gap:4px}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:12px;font-weight:750;color:#5d6c7a}.nav button.active,.nav button:hover{background:var(--soft);color:var(--dark)}.side-bottom{margin-top:auto;display:grid;gap:8px;padding:12px}.main{margin-left:232px;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar strong{font-size:17px}.topbar-actions{display:flex;gap:8px;align-items:center}.mobile-top,.mobile-nav{display:none}.content{max-width:1440px;margin:auto;padding:27px 30px 110px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.page-head h1{font-size:29px;margin:0 0 6px}.page-head p{margin:0;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:white;color:var(--text);font-weight:750;min-height:42px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:#bd4444;border-color:#f1cece}.btn.small{padding:6px 10px;min-height:32px;font-size:12px}.btn:hover:not(:disabled){filter:brightness(.97)}
.grid{display:grid;gap:16px}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-main{grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 14px;font-size:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin:8px 0}.section-title{display:flex;justify-content:space-between;align-items:center;margin:23px 0 11px}.section-title h2{font-size:17px;margin:0}.link{border:0;background:transparent;color:var(--dark);font-weight:750;padding:5px}.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);min-width:0}.row:last-child{border-bottom:0}.row-main{flex:1;min-width:0}.row-main strong{display:block}.row-main small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.avatar{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--dark);display:grid;place-items:center;font-weight:900}.pill{border-radius:99px;background:var(--soft);color:var(--dark);padding:5px 9px;font-size:12px;font-weight:750;white-space:nowrap}.pill.warn{background:var(--orange);color:#9c6113}.pill.bad{background:var(--red);color:#c34d4d}.pill.blue{background:var(--blue);color:#436ab8}.muted{color:var(--muted)}.notice{border-radius:13px;padding:12px 14px;background:var(--soft);color:#126943;line-height:1.5}.notice.warn{background:var(--orange);color:#865912}.notice.error{background:var(--red);color:#a53c3c}.empty{padding:34px 14px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar>*{min-width:140px}.toolbar input{flex:1}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#526171}.input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfcfd;border-radius:12px;padding:11px 12px;color:var(--text)}textarea{min-height:95px;resize:vertical}.field-help{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.tabs .active{background:var(--soft);color:var(--dark);border-color:#bbe6cc}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:590px}.data-table th,.data-table td{border-bottom:1px solid var(--line);text-align:left;padding:12px 10px;vertical-align:top;font-size:13px}.data-table th{font-size:11px;color:var(--muted)}.data-table tr:last-child td{border-bottom:0}.stack{display:grid;gap:12px}.detail-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.detail-line:last-child{border-bottom:0}.detail-line span{color:var(--muted)}.detail-line strong{text-align:right}.task{border-left:3px solid var(--green);padding:8px 12px;background:#fbfdfc;border-radius:0 11px 11px 0}.task.warn{border-color:#e59728}.exercise{display:grid;grid-template-columns:minmax(120px,1.3fr) 75px 85px minmax(100px,1fr) 50px;gap:7px;align-items:end;margin-bottom:8px}.exercise .input{padding:9px}.calendar-row{display:grid;grid-template-columns:70px 1fr;gap:14px;border-bottom:1px solid var(--line);padding:13px 0}.calendar-row:last-child{border-bottom:0}.event{background:var(--blue);border-left:3px solid #4b80ff;padding:10px;border-radius:9px}.event.done{background:var(--soft);border-color:var(--green)}.event.cancelled{background:#f4f5f6;border-color:#adb6c0}.modal-backdrop{position:fixed;inset:0;background:rgba(13,31,31,.54);display:grid;place-items:center;z-index:50;padding:14px}.modal{width:min(100%,570px);max-height:min(90vh,900px);overflow:auto;background:white;border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.modal-head h2{font-size:20px;margin:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;right:20px;bottom:22px;z-index:80;background:#163b2b;color:white;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);max-width:360px}.demo-tag{font-size:11px;color:var(--muted);background:#f0f3f4;border-radius:99px;padding:6px 9px}.progress{height:8px;background:#e6edef;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
@media(max-width:1120px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-main{grid-template-columns:1fr}}
@media(max-width:760px){.login-card{grid-template-columns:1fr}.login-visual{min-height:245px;padding:28px}.login-panel{padding:28px}.sidebar,.topbar{display:none}.main{margin-left:0}.mobile-top{display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);height:58px;align-items:center;justify-content:space-between;padding:0 14px}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,minmax(0,1fr));height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{border:0;background:white;color:#7f8a97;font-size:11px;font-weight:800}.mobile-nav button.active{color:var(--dark)}.mobile-nav b{display:block;font-size:18px}.content{padding:17px 14px 105px}.page-head{display:block}.page-head h1{font-size:24px}.page-head .actions{margin-top:14px}.cols-4,.cols-2{grid-template-columns:1fr}.row{align-items:flex-start;flex-wrap:wrap}.row-main{flex:1 1 calc(100% - 60px)}.row-actions{justify-content:flex-end;margin-left:auto}.exercise{grid-template-columns:1fr 1fr}.exercise .wide{grid-column:span 2}.exercise .remove{grid-column:span 2}.calendar-row{grid-template-columns:55px 1fr}.toast{bottom:82px;left:14px;right:14px;max-width:none}}
.connected-detail strong{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><div class="login-visual"><div><div class="chiprow"><span>AI 训练总结</span><span>会员管理</span><span>训练记录</span></div><h1>AI Coach OS<br>私教工作台</h1><p>更快地记录每一次训练，用历史数据和 AI 辅助下一次训练决策。</p></div><div class="chiprow"><span>本地演示原型</span><span>数据只存在本机浏览器</span></div></div><form id="loginForm" class="login-panel" method="post"><h2>欢迎回来</h2><p class="muted">登录进入教练工作台演示</p><div class="field"><label for="loginEmail">账号</label><input id="loginEmail" class="input" type="email" required autocomplete="username"></div><div class="field"><label for="loginPassword">密码</label><input id="loginPassword" class="input" type="password" required autocomplete="current-password"></div><p class="field-help" id="demoLoginHelp">演示账号：coach@example.com / 123456</p><button class="btn primary" type="submit">登录</button><button class="btn" type="button" data-action="trial" style="margin-top:9px">申请试用</button><p id="loginError" class="notice error hidden" role="alert"></p></form></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><h2>AI Coach OS</h2><small>面向独立私教的 AI 工作台</small></div><div class="coach-badge"><strong>Coach Wen</strong><small id="sideStatus">准备开始今天的训练</small></div><nav id="desktopNav" class="nav" aria-label="主导航"></nav><div class="side-bottom"><span class="demo-tag">本地演示 · 非真实数据</span><button class="btn small" data-action="reset">重置演示</button><button class="btn small danger" data-action="logout">退出登录</button></div></aside><div class="main"><header class="topbar"><strong id="topTitle">首页</strong><div class="topbar-actions"><button class="btn small" data-action="search">搜索</button><button class="btn small" data-action="notifications">提醒 <span id="noticeCount"></span></button><span class="avatar" aria-label="Coach Wen">C</span></div></header><div class="mobile-top"><strong id="mobileTitle">首页</strong><div class="actions"><button class="btn small" data-action="search" aria-label="搜索">⌕</button><button class="btn small" data-action="menu" aria-label="更多操作">⋯</button></div></div><main id="content" class="content" tabindex="-1"></main></div><nav id="mobileNav" class="mobile-nav" aria-label="手机导航"></nav></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const connectedMode = location.pathname === '/app/';
const KEY='ai-coach-os-final-prototype-v1';
const today=()=>new Date().toLocaleDateString('en-CA');
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const uid=()=>Math.random().toString(36).slice(2,10);
const weekStart=value=>{const d=new Date(value+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('en-CA')};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({version:1,loggedIn:false,page:'dashboard',currentMemberId:'m1',activeSessionId:null,scheduleView:'day',scheduleDate:today(),memberFilter:'all',memberSort:'recent',memberSearch:'',historySearch:'',historyMember:'all',historyRange:'30',drafts:{},members:[{id:'m1',name:'张伟',phone:'000-0000-0000',goal:'减脂塑形',status:'训练中',lessons:8,totalLessons:20,age:28,height:181,weight:78,note:'偏好 60 分钟课程。',attention:''},{id:'m2',name:'Lisa',phone:'000-0000-0000',goal:'增肌训练',status:'训练中',lessons:10,totalLessons:16,age:25,height:165,weight:58,note:'偏好下肢训练。',attention:''},{id:'m3',name:'王芳',phone:'000-0000-0000',goal:'体态训练',status:'待跟进',lessons:3,totalLessons:12,age:32,height:168,weight:62,note:'训练时注意膝部反馈。',attention:'连续两次反馈膝部不适；如持续不适，应建议线下评估。'},{id:'m4',name:'Kevin',phone:'000-0000-0000',goal:'力量训练',status:'训练中',lessons:12,totalLessons:20,age:26,height:180,weight:76,note:'核心稳定性需要关注。',attention:''}],appointments:[{id:'a1',memberId:'m1',date:today(),time:'09:00',duration:60,topic:'上肢力量',status:'scheduled'},{id:'a2',memberId:'m2',date:today(),time:'10:30',duration:60,topic:'下肢训练',status:'scheduled'},{id:'a3',memberId:'m3',date:today(),time:'14:00',duration:60,topic:'体态训练',status:'scheduled'},{id:'a4',memberId:'m4',date:addDays(1),time:'09:00',duration:60,topic:'背部训练',status:'scheduled'}],sessions:[{id:'s0',memberId:'m1',date:addDays(-3),topic:'上肢力量',feedback:'卧推最后一组较吃力。',exercises:[{name:'杠铃卧推',sets:4,weight:'62.5kg',reps:'8/8/8/7'},{name:'坐姿划船',sets:4,weight:'50kg',reps:'12/12/12/10'}],charged:true}],suggestions:[],plans:[]});
let state;
if (!connectedMode) {
  try { const saved=JSON.parse(localStorage.getItem(KEY)); state=saved?.version===1?saved:seed(); }
  catch { state=seed(); }
}
let toastTimer;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{message('浏览器无法保存演示数据；刷新后可能重置。')}};
const message=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3800)};
const member=id=>state.members.find(m=>m.id===id);
const current=()=>member(state.currentMemberId)||state.members[0];
const memberName=id=>member(id)?.name||'已删除会员';
const sessionsFor=id=>state.sessions.filter(s=>s.memberId===id).sort((a,b)=>b.date.localeCompare(a.date));
const nextAppointment=id=>state.appointments.filter(a=>a.memberId===id&&a.status==='scheduled'&&a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
const pendingFor=id=>state.suggestions.filter(s=>s.memberId===id&&s.status==='pending');
const allPending=()=>state.suggestions.filter(s=>s.status==='pending');
const btn=(label,action,kind='',extra='')=>`<button type="button" class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`;
const title=(heading,description,actions='')=>`<div class="page-head"><div><h1>${heading}</h1><p>${description}</p></div><div class="actions">${actions}</div></div>`;
const empty=(text,action='',label='')=>`<div class="empty">${text}${action?`<div style="margin-top:12px">${btn(label,action,'primary',action==='go'?'data-page="ai"':'')}</div>`:''}</div>`;
const navItems=[['dashboard','⌂','首页'],['members','◎','会员'],['training','▣','训练'],['schedule','◫','日程'],['ai','✦','AI']];
function renderShell(){document.getElementById('login').classList.toggle('hidden',state.loggedIn);document.getElementById('app').classList.toggle('hidden',!state.loggedIn);if(!state.loggedIn)return;document.getElementById('desktopNav').innerHTML=navItems.map(([id,icon,name])=>`<button type="button" data-action="go" data-page="${id}" class="${state.page===id?'active':''}">${icon}　${name}</button>`).join('')+`<button type="button" data-action="go" data-page="history" class="${state.page==='history'?'active':''}">≣　训练历史</button>`;document.getElementById('mobileNav').innerHTML=navItems.map(([id,icon,name])=>`<button type="button" data-action="go" data-page="${id}" class="${state.page===id?'active':''}"><b>${icon}</b>${name}</button>`).join('');const names={dashboard:'首页',members:'会员',member:'会员详情',training:'训练记录',history:'训练历史',schedule:'日程',ai:'AI 分析'};document.getElementById('topTitle').textContent=names[state.page]||'首页';document.getElementById('mobileTitle').textContent=names[state.page]||'首页';document.getElementById('noticeCount').textContent=allPending().length||'';document.getElementById('sideStatus').textContent=`今天 ${state.appointments.filter(a=>a.date===today()&&a.status==='scheduled').length} 节待上课程`;document.getElementById('content').innerHTML=({dashboard:renderDashboard,members:renderMembers,member:renderMember,training:renderTraining,history:renderHistory,schedule:renderSchedule,ai:renderAI}[state.page]||renderDashboard)()}
function go(page,id){if(id&&member(id))state.currentMemberId=id;state.page=page;save();renderShell();window.scrollTo(0,0)}
function renderDashboard(){const todays=state.appointments.filter(a=>a.date===today()&&a.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));const low=state.members.filter(m=>m.lessons<=3);const latest=sessionsFor(current().id)[0];return title('早上好，Coach 👋',`今天有 ${todays.length} 节课程。先看会员状态，再开始训练。`,btn('查看今日日程','go','',`data-page="schedule"`)+btn('开始记录训练','startTraining','primary'))+`<div class="grid cols-4"><div class="card stat"><small>今日课程</small><strong>${todays.length}</strong><small>已取消课程不计入</small></div><div class="card stat"><small>会员</small><strong>${state.members.length}</strong><small>仅显示当前教练数据</small></div><div class="card stat"><small>已完成训练</small><strong>${state.sessions.length}</strong><small>演示记录</small></div><div class="card stat"><small>待确认 AI 建议</small><strong>${allPending().length}</strong><small>需由教练确认</small></div></div><div class="grid cols-main"><section><div class="section-title"><h2>今日课程</h2>${btn('查看全部','go','small',`data-page="schedule"`)}</div><div class="card">${todays.length?todays.map(a=>`<div class="row"><span class="pill blue">${esc(a.time)}</span><div class="row-main"><strong>${esc(memberName(a.memberId))} · ${esc(a.topic)}</strong><small>${a.duration} 分钟 · ${a.status==='completed'?'已完成':'待开始'}</small></div><div class="row-actions">${btn('查看会员','openMember','small',`data-id="${a.memberId}"`)}${a.status==='scheduled'?btn('开始训练','startTraining','small primary',`data-id="${a.memberId}" data-appointment="${a.id}"`):''}</div></div>`).join(''):empty('今天没有课程。','newAppointment','新建预约')}</div></section><section><div class="section-title"><h2>待处理事项</h2></div><div class="card stack">${allPending().length?`<div class="task"><strong>${allPending().length} 条 AI 建议待确认</strong><div class="muted">逐条查看后再用于下次计划。</div>${btn('查看建议','go','small',`data-page="ai"`)}</div>`:''}${low.length?`<div class="task warn"><strong>${low.length} 位会员剩余课时较少</strong><div class="muted">${low.map(m=>`${esc(m.name)} ${m.lessons} 节`).join('、')}</div></div>`:''}${state.members.filter(m=>m.attention).map(m=>`<div class="task warn"><strong>${esc(m.name)} · 训练提醒</strong><div class="muted">${esc(m.attention)}</div>${btn('查看会员','openMember','small',`data-id="${m.id}"`)}</div>`).join('')}${!low.length&&!allPending().length&&!state.members.some(m=>m.attention)?empty('目前没有待处理事项。'):''}</div></section></div><div class="section-title"><h2>当前会员 · ${esc(current().name)}</h2>${btn('查看会员档案','go','small',`data-page="member"`)}</div><div class="card"><div class="row"><div class="row-main"><strong>${esc(current().goal)} · 剩余 ${current().lessons} 节</strong><small>${latest?`最近训练 ${esc(latest.date)} · ${esc(latest.topic)}`:'暂无训练记录'}</small></div>${btn('继续工作','startTraining','primary')}</div></div>`}
function renderMembers(){let list=[...state.members];const q=state.memberSearch.trim().toLowerCase();if(q)list=list.filter(m=>[m.name,m.phone,m.goal].some(v=>v.toLowerCase().includes(q)));if(state.memberFilter!=='all')list=list.filter(m=>m.status===state.memberFilter);if(state.memberSort==='lessons')list.sort((a,b)=>a.lessons-b.lessons);else if(state.memberSort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));else list.sort((a,b)=>(sessionsFor(b.id)[0]?.date||'').localeCompare(sessionsFor(a.id)[0]?.date||''));return title('会员管理','选择会员后可查看档案、训练历史和课时。',btn('导出会员','exportMembers')+btn('添加会员','newMember','primary'))+`<div class="toolbar"><input id="memberSearch" class="input" type="search" placeholder="搜索姓名 / 手机号 / 训练目标" value="${esc(state.memberSearch)}" aria-label="搜索会员"><select id="memberFilter" aria-label="筛选会员状态"><option value="all">全部状态</option>${['训练中','待跟进','已结课'].map(v=>`<option ${state.memberFilter===v?'selected':''}>${v}</option>`).join('')}</select><select id="memberSort" aria-label="会员排序"><option value="recent" ${state.memberSort==='recent'?'selected':''}>最近训练</option><option value="lessons" ${state.memberSort==='lessons'?'selected':''}>剩余课时</option><option value="name" ${state.memberSort==='name'?'selected':''}>姓名</option></select></div><div class="card">${list.length?list.map(m=>`<div class="row"><div class="avatar">${esc(m.name.slice(0,1))}</div><div class="row-main"><strong>${esc(m.name)}</strong><small>${esc(m.goal)} · ${esc(m.status)} · ${sessionsFor(m.id)[0]?`最近训练 ${esc(sessionsFor(m.id)[0].date)}`:'暂无训练'}</small></div><span class="pill ${m.lessons<=3?'warn':''}">剩余 ${m.lessons} 节</span><div class="row-actions">${btn('查看','openMember','small',`data-id="${m.id}"`)}</div></div>`).join(''):empty('没有找到符合条件的会员。')}</div>`}
function renderMember(){const m=current(),records=sessionsFor(m.id),next=nextAppointment(m.id),plans=state.plans.filter(p=>p.memberId===m.id).slice(-2).reverse();return title(esc(m.name),`会员档案 · ${esc(m.goal)} · ${esc(m.status)}`,btn('返回会员','go','',`data-page="members"`)+btn('编辑资料','editMember','',`data-id="${m.id}"`)+btn('开始训练','startTraining','primary',`data-id="${m.id}"`))+`<div class="grid cols-2"><div class="card"><h3>会员信息</h3><div class="detail-line"><span>年龄 / 身高 / 体重</span><strong>${m.age||'—'} 岁 / ${m.height||'—'} cm / ${m.weight||'—'} kg</strong></div><div class="detail-line"><span>手机号</span><strong>${esc(m.phone||'—')}</strong></div><div class="detail-line"><span>备注</span><strong>${esc(m.note||'—')}</strong></div>${m.attention?`<p class="notice warn">${esc(m.attention)}</p>`:''}</div><div class="card"><h3>课程状态</h3><div class="detail-line"><span>剩余课时</span><strong>${m.lessons} / ${m.totalLessons} 节</strong></div><div class="progress" aria-label="剩余课时比例"><span style="width:${Math.min(100,Math.round(m.lessons/Math.max(m.totalLessons,1)*100))}%"></span></div><p class="muted">${next?`下次预约：${esc(next.date)} ${esc(next.time)} · ${esc(next.topic)}`:'暂无后续预约'}</p>${m.lessons<=3?'<p class="notice warn">剩余课时较少，请与会员确认后续安排。</p>':''}</div></div><div class="grid cols-2"><section><div class="section-title"><h2>最近训练</h2>${btn('查看全部','go','small',`data-page="history"`)}</div><div class="card">${records.length?records.slice(0,3).map(s=>`<div class="row"><div class="row-main"><strong>${esc(s.date)} · ${esc(s.topic)}</strong><small>${s.exercises.length} 个动作 · ${esc(s.feedback||'无反馈')}</small></div>${btn('查看','viewSession','small',`data-id="${s.id}"`)}</div>`).join(''):empty('暂无训练记录。')}</div></section><section><div class="section-title"><h2>下次训练计划</h2>${btn('AI 建议','go','small',`data-page="ai"`)}</div><div class="card">${plans.length?plans.map(p=>`<div class="task"><strong>${esc(p.title)}</strong><div class="muted">${p.exercises.map(e=>esc(e.name)).join(' / ')}</div>${btn('用于训练','applyPlan','small',`data-id="${p.id}"`)}</div>`).join(''):empty('尚无已确认的下次计划。','go','查看 AI 建议')}</div></section></div>`}
function draft(){const m=current();if(!state.drafts[m.id]){const p=state.plans.filter(p=>p.memberId===m.id).at(-1);state.drafts[m.id]={date:today(),topic:nextAppointment(m.id)?.topic||p?.title||'本次训练',feedback:'',exercises:p?structuredClone(p.exercises):[{name:'',sets:3,weight:'',reps:''}]}}return state.drafts[m.id]}
function renderTraining(){const m=current(),d=draft(),active=state.sessions.find(s=>s.id===state.activeSessionId&&s.memberId===m.id),last=sessionsFor(m.id)[0];return title('训练记录',`当前会员：${esc(m.name)} · 剩余 ${m.lessons} 节`,btn('选择会员','chooseMember')+btn('智能粘贴','smartPaste')+btn('新建训练','newSession')+btn(active?'更新训练记录':'保存并结束上课','saveTraining','primary'))+`<div class="grid cols-main"><div class="stack"><div class="card"><h3>${active?'编辑已保存记录':'当前课程'}</h3><div class="grid cols-2"><div class="field"><label for="trainingDate">训练日期</label><input id="trainingDate" class="input" type="date" value="${esc(d.date)}"></div><div class="field"><label for="trainingTopic">训练主题</label><input id="trainingTopic" class="input" value="${esc(d.topic)}" maxlength="80"></div></div><p class="field-help">${active?'更新此记录不会再次扣课。':'首次保存本次训练时，若有剩余课时将扣除 1 节。'}</p></div><div class="card"><div class="section-title" style="margin:0 0 12px"><h2>训练动作</h2>${btn('添加动作','addExercise','small')}</div><div class="exercise muted" aria-hidden="true"><span class="wide">动作</span><span>组数</span><span>重量</span><span class="wide">每组次数</span><span></span></div>${d.exercises.map((e,i)=>`<div class="exercise"><input class="input wide exercise-input" data-index="${i}" data-field="name" aria-label="动作 ${i+1} 名称" placeholder="动作名称" value="${esc(e.name)}"><input class="input exercise-input" data-index="${i}" data-field="sets" aria-label="动作 ${i+1} 组数" type="number" min="1" max="30" value="${esc(e.sets)}"><input class="input exercise-input" data-index="${i}" data-field="weight" aria-label="动作 ${i+1} 重量" placeholder="如 65kg" value="${esc(e.weight)}"><input class="input wide exercise-input" data-index="${i}" data-field="reps" aria-label="动作 ${i+1} 每组次数" placeholder="如 8/8/8/7" value="${esc(e.reps)}">${btn('删除','removeExercise','small danger remove',`data-index="${i}" aria-label="删除动作 ${i+1}"`)}</div>`).join('')}</div><div class="card"><h3>训练反馈</h3><textarea id="trainingFeedback" placeholder="记录会员状态、动作质量及下次注意事项">${esc(d.feedback)}</textarea></div></div><div class="stack"><div class="card"><h3>训练上下文</h3><p><strong>${esc(m.name)}</strong> · ${esc(m.goal)}</p>${m.attention?`<p class="notice warn">${esc(m.attention)}</p>`:''}<p class="muted">${last?`最近一次：${esc(last.date)} ${esc(last.topic)}，${esc(last.feedback||'无反馈')}`:'该会员暂无训练历史。'}</p>${m.lessons<=3?'<p class="notice warn">剩余课时较少。</p>':''}</div><div class="card"><h3>下一步</h3><p class="muted">保存训练后，生成总结，再由教练确认下次计划。</p>${btn('生成本次总结','generateAI','primary',`${sessionsFor(m.id).length?'':'disabled'}`)}<p class="field-help">AI 内容为本地规则生成的演示文本。</p></div></div></div>`}
function renderHistory(){let list=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));const q=state.historySearch.trim().toLowerCase();if(q)list=list.filter(s=>[memberName(s.memberId),s.topic,s.feedback,...s.exercises.map(e=>e.name)].some(v=>v.toLowerCase().includes(q)));if(state.historyMember!=='all')list=list.filter(s=>s.memberId===state.historyMember);if(state.historyRange!=='all'){const min=addDays(-Number(state.historyRange));list=list.filter(s=>s.date>=min)}return title('训练历史','查找记录、继续编辑或导出当前筛选结果。',btn('导出记录','exportHistory')+btn('开始新训练','newSession','primary'))+`<div class="toolbar"><input id="historySearch" class="input" type="search" placeholder="搜索会员 / 主题 / 动作" value="${esc(state.historySearch)}" aria-label="搜索训练历史"><select id="historyMember" aria-label="筛选会员"><option value="all">全部会员</option>${state.members.map(m=>`<option value="${m.id}" ${state.historyMember===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><select id="historyRange" aria-label="筛选日期"><option value="30" ${state.historyRange==='30'?'selected':''}>最近 30 天</option><option value="7" ${state.historyRange==='7'?'selected':''}>最近 7 天</option><option value="all" ${state.historyRange==='all'?'selected':''}>全部时间</option></select></div><div class="card">${list.length?list.map(s=>`<div class="row"><div class="row-main"><strong>${esc(s.date)} · ${esc(memberName(s.memberId))} · ${esc(s.topic)}</strong><small>${s.exercises.map(e=>esc(e.name)).join(' / ')}${s.charged?' · 已扣课':' · 未扣课'}</small></div><div class="row-actions">${btn('查看','viewSession','small',`data-id="${s.id}"`)}${btn('编辑','editSession','small',`data-id="${s.id}"`)}</div></div>`).join(''):empty('没有符合条件的训练记录。','newSession','开始新训练')}</div>`}
function renderSchedule(){const date=state.scheduleDate;let list=state.appointments.filter(a=>state.scheduleView==='day'?a.date===date:state.scheduleView==='week'?weekStart(a.date)===weekStart(date):a.date.slice(0,7)===date.slice(0,7)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const status={scheduled:'已预约',completed:'已完成',cancelled:'已取消'};return title('日程',`查看和管理会员预约。当前基准日期：${esc(date)}`,btn('AI 排课建议','scheduleAdvice')+btn('新建预约','newAppointment','primary'))+`<div class="toolbar"><input id="scheduleDate" class="input" type="date" value="${esc(date)}" aria-label="选择日程日期"><div class="tabs">${[['day','日'],['week','周'],['month','月']].map(([v,t])=>btn(t,'scheduleView',`small ${state.scheduleView===v?'active':''}`,`data-view="${v}"`)).join('')}</div></div><div class="card">${list.length?list.map(a=>`<div class="calendar-row"><strong>${esc(a.date===date?a.time:a.date+' '+a.time)}</strong><div class="event ${a.status==='completed'?'done':a.status==='cancelled'?'cancelled':''}"><strong>${esc(memberName(a.memberId))} · ${esc(a.topic)}</strong><div class="muted">${a.duration} 分钟 · ${status[a.status]}</div><div class="row-actions" style="margin-top:8px">${btn('会员','openMember','small',`data-id="${a.memberId}"`)}${a.status==='scheduled'?btn('开始训练','startTraining','small primary',`data-id="${a.memberId}" data-appointment="${a.id}"`):''}${btn('编辑','editAppointment','small',`data-id="${a.id}"`)}${a.status==='scheduled'?btn('标记完成','completeAppointment','small',`data-id="${a.id}"`):''}${a.status!=='cancelled'?btn('取消','cancelAppointment','small danger',`data-id="${a.id}"`):''}</div></div></div>`).join(''):empty('此时间范围内没有预约。','newAppointment','新建预约')}</div><p class="field-help">标记预约完成不会扣课；训练记录首次保存时才扣课。</p>`}
function renderAI(){const m=current(),records=sessionsFor(m.id),latest=records[0],suggestions=state.suggestions.filter(s=>s.memberId===m.id).slice().reverse(),pending=allPending(),plans=state.plans.filter(p=>p.memberId===m.id).slice().reverse();return title('AI 分析',`当前会员：${esc(m.name)}。建议需经教练确认才会成为训练计划。`,btn('选择会员','chooseMember')+btn('生成本次总结','generateAI','primary',latest?'':'disabled'))+`<div class="grid cols-main"><div class="stack"><div class="card"><h3>本次训练依据</h3>${latest?`<p><strong>${esc(latest.date)} · ${esc(latest.topic)}</strong></p><p class="muted">${latest.exercises.map(e=>esc(e.name)).join(' / ')} · ${esc(latest.feedback||'未填写反馈')}</p>`:empty('该会员还没有训练记录。','startTraining','开始训练')}${m.attention?`<p class="notice warn">${esc(m.attention)}</p>`:''}</div><div class="card"><h3>${esc(m.name)} · AI 建议</h3>${suggestions.length?suggestions.map(s=>`<div class="task ${s.status==='pending'?'warn':''}" style="margin-bottom:11px"><strong>${esc(s.title)}</strong><p>${esc(s.summary)}</p><div class="muted">${s.exercises.map(e=>`${esc(e.name)} ${esc(e.sets)}组`).join(' / ')}</div><p class="field-help">${s.status==='pending'?'待教练确认':s.status==='confirmed'?'已确认并加入下次计划':'已忽略'} · ${esc(s.createdAt)}</p>${s.status==='pending'?`<div class="row-actions">${btn('确认用于下次计划','confirmAI','small primary',`data-id="${s.id}"`)}${btn('忽略','dismissAI','small',`data-id="${s.id}"`)}</div>`:''}</div>`).join(''):empty('暂无 AI 建议。先保存一次训练，再生成总结。')}</div></div><div class="stack"><div class="card"><h3>待处理建议</h3>${pending.length?pending.map(s=>`<div class="row"><div class="row-main"><strong>${esc(memberName(s.memberId))}</strong><small>${esc(s.title)}</small></div>${btn('查看','openAIFor','small',`data-id="${s.memberId}"`)}</div>`).join(''):empty('没有待确认建议。')}</div><div class="card"><h3>已确认的下次计划</h3>${plans.length?plans.map(p=>`<div class="task" style="margin-bottom:10px"><strong>${esc(p.title)}</strong><div class="muted">${p.exercises.map(e=>esc(e.name)).join(' / ')}</div>${btn('用于训练','applyPlan','small',`data-id="${p.id}"`)}</div>`).join(''):empty('教练确认建议后会显示在这里。')}</div><div class="notice">AI 内容由本地示例规则生成，仅供原型演示；请由教练核对训练安排和风险提示。</div></div></div>`}
function openModal(heading,html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="closeBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(heading)}"><div class="modal-head"><h2>${esc(heading)}</h2>${btn('关闭','closeModal','small',`aria-label="关闭${esc(heading)}"`)}</div>${html}</div></div>`;document.querySelector('.modal input,.modal button')?.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function memberForm(id){const m=id?member(id):null;openModal(m?'编辑会员':'添加会员',`<form id="memberForm" data-id="${m?.id||''}"><div class="grid cols-2"><div class="field"><label for="mName">姓名 *</label><input id="mName" class="input" required maxlength="40" value="${esc(m?.name||'')}"></div><div class="field"><label for="mPhone">手机号</label><input id="mPhone" class="input" inputmode="tel" maxlength="30" value="${esc(m?.phone||'')}"></div><div class="field"><label for="mGoal">训练目标 *</label><input id="mGoal" class="input" required maxlength="80" value="${esc(m?.goal||'')}"></div><div class="field"><label for="mStatus">状态</label><select id="mStatus">${['训练中','待跟进','已结课'].map(v=>`<option ${m?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="mLessons">剩余课时</label><input id="mLessons" class="input" type="number" min="0" max="999" value="${m?.lessons??0}"></div><div class="field"><label for="mTotal">总课时</label><input id="mTotal" class="input" type="number" min="0" max="999" value="${m?.totalLessons??0}"></div><div class="field"><label for="mAge">年龄</label><input id="mAge" class="input" type="number" min="0" max="120" value="${m?.age??''}"></div><div class="field"><label for="mHeight">身高 cm</label><input id="mHeight" class="input" type="number" min="0" max="250" value="${m?.height??''}"></div><div class="field"><label for="mWeight">体重 kg</label><input id="mWeight" class="input" type="number" min="0" max="400" step="0.1" value="${m?.weight??''}"></div></div><div class="field"><label for="mNote">备注</label><textarea id="mNote">${esc(m?.note||'')}</textarea></div><div class="field"><label for="mAttention">训练提醒</label><textarea id="mAttention">${esc(m?.attention||'')}</textarea></div><div class="modal-actions">${btn('取消','closeModal')}<button class="btn primary" type="submit">保存会员</button></div></form>`)}
function appointmentForm(id){const a=id?state.appointments.find(x=>x.id===id):null;openModal(a?'编辑预约':'新建预约',`<form id="appointmentForm" data-id="${a?.id||''}"><div class="field"><label for="aMember">会员 *</label><select id="aMember" required>${state.members.map(m=>`<option value="${m.id}" ${(a?.memberId||current().id)===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="grid cols-2"><div class="field"><label for="aDate">日期 *</label><input id="aDate" class="input" type="date" required value="${esc(a?.date||state.scheduleDate)}"></div><div class="field"><label for="aTime">时间 *</label><input id="aTime" class="input" type="time" required value="${esc(a?.time||'09:00')}"></div><div class="field"><label for="aDuration">时长（分钟）</label><input id="aDuration" class="input" type="number" min="15" max="240" required value="${a?.duration||60}"></div><div class="field"><label for="aTopic">训练主题 *</label><input id="aTopic" class="input" maxlength="80" required value="${esc(a?.topic||'本次训练')}"></div></div><div class="modal-actions">${btn('取消','closeModal')}<button type="submit" class="btn primary">保存预约</button></div></form>`)}
function csv(name,rows){const value=rows.map(row=>row.map(cell=>`"${String(cell??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+value],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('演示数据已导出为 CSV。')}
function exportMembers(){csv('coach-members.csv',[['姓名','电话','目标','状态','剩余课时','总课时'],...state.members.map(m=>[m.name,m.phone,m.goal,m.status,m.lessons,m.totalLessons])])}
function exportHistory(){let list=[...state.sessions];const q=state.historySearch.trim().toLowerCase();if(q)list=list.filter(s=>[memberName(s.memberId),s.topic,s.feedback,...s.exercises.map(e=>e.name)].some(v=>v.toLowerCase().includes(q)));if(state.historyMember!=='all')list=list.filter(s=>s.memberId===state.historyMember);if(state.historyRange!=='all')list=list.filter(s=>s.date>=addDays(-Number(state.historyRange)));csv('coach-training-history.csv',[['日期','会员','主题','动作','反馈','是否扣课'],...list.map(s=>[s.date,memberName(s.memberId),s.topic,s.exercises.map(e=>`${e.name} ${e.sets}组 ${e.weight} ${e.reps}`).join('; '),s.feedback,s.charged?'是':'否'])])}
function syncDraft(){if(state.page!=='training')return;const d=draft();d.date=document.getElementById('trainingDate')?.value||d.date;d.topic=document.getElementById('trainingTopic')?.value||d.topic;d.feedback=document.getElementById('trainingFeedback')?.value||'';document.querySelectorAll('.exercise-input').forEach(el=>{d.exercises[Number(el.dataset.index)][el.dataset.field]=el.dataset.field==='sets'?Number(el.value):el.value});save()}
function startTraining(id,appointmentId){if(id&&member(id))state.currentMemberId=id;state.activeSessionId=null;const m=current();const a=state.appointments.find(x=>x.id===appointmentId)||nextAppointment(m.id);state.drafts[m.id]={date:a?.date||today(),topic:a?.topic||'本次训练',feedback:'',exercises:[{name:'',sets:3,weight:'',reps:''}]};go('training')}
function saveTraining(){syncDraft();const d=draft(),m=current();if(!d.date||!d.topic.trim()){message('请填写训练日期和主题。');return}if(!d.exercises.length||d.exercises.some(e=>!e.name.trim()||!Number.isInteger(Number(e.sets))||Number(e.sets)<1||!e.reps.trim())){message('请填写每个动作的名称、组数和次数。');return}let s=state.sessions.find(x=>x.id===state.activeSessionId&&x.memberId===m.id);const copy={date:d.date,topic:d.topic.trim(),feedback:d.feedback.trim(),exercises:structuredClone(d.exercises)};if(s){Object.assign(s,copy);message('训练记录已更新，本次未重复扣课。')}else{const alreadyCharged=state.sessions.some(x=>x.memberId===m.id&&x.date===d.date&&x.charged);const charged=m.lessons>0&&!alreadyCharged;if(charged)m.lessons--;s={id:uid(),memberId:m.id,...copy,charged};state.sessions.push(s);state.activeSessionId=s.id;const a=state.appointments.find(x=>x.memberId===m.id&&x.date===d.date&&x.status==='scheduled');if(a)a.status='completed';message(charged?'训练已保存并扣除 1 节课。':alreadyCharged?'训练已保存；该会员当天已有扣课记录，本次未重复扣课。':'训练已保存；剩余课时为 0，本次未扣课。')}save();renderShell()}
function generateAI(){syncDraft();const m=current(),s=state.sessions.find(x=>x.id===state.activeSessionId&&x.memberId===m.id)||sessionsFor(m.id)[0];if(!s){message('请先保存该会员的训练记录。');return}const existing=state.suggestions.find(x=>x.sessionId===s.id&&x.status!=='dismissed');if(existing){go('ai');message(existing.status==='pending'?'此训练已有待确认建议。':'此训练的建议已经确认。');return}const exercises=structuredClone(s.exercises);const warning=m.attention?`注意：${m.attention}`:'';state.suggestions.push({id:uid(),memberId:m.id,sessionId:s.id,status:'pending',createdAt:today(),title:`${s.topic} · 下次训练建议`,summary:`已整理 ${s.exercises.length} 个动作。教练反馈：${s.feedback||'未填写'}。${warning} 下次训练请先复核会员状态，再决定是否调整负荷。`,exercises});save();go('ai');message('已生成演示总结，请确认或忽略。')}
function confirmAI(id){const s=state.suggestions.find(x=>x.id===id&&x.status==='pending');if(!s)return;s.status='confirmed';state.plans.push({id:uid(),memberId:s.memberId,title:s.title,exercises:structuredClone(s.exercises),sourceId:s.id});save();renderShell();message('建议已确认，加入下次训练计划。')}
function applyPlan(id){const p=state.plans.find(x=>x.id===id);if(!p)return;state.currentMemberId=p.memberId;state.activeSessionId=null;state.drafts[p.memberId]={date:today(),topic:p.title,feedback:'',exercises:structuredClone(p.exercises)};go('training');message('计划已载入训练草稿；保存训练后才会扣课。')}
function smartPaste(){openModal('智能粘贴 · 演示解析',`<p class="muted">每行一个动作，例如：杠铃卧推 65kg 4x8。解析结果会填入当前训练草稿，可继续编辑。</p><form id="pasteForm"><div class="field"><label for="pasteText">训练文字</label><textarea id="pasteText" required placeholder="杠铃卧推 65kg 4x8\n坐姿划船 50kg 4x12"></textarea></div><p class="field-help">本地规则演示，仅识别“动作 重量 组数x次数”。</p><div class="modal-actions">${btn('取消','closeModal')}<button class="btn primary" type="submit">解析并填入</button></div></form>`)}
function viewSession(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;openModal('训练记录详情',`<p><strong>${esc(memberName(s.memberId))} · ${esc(s.date)} · ${esc(s.topic)}</strong></p><div class="card table-wrap"><table class="data-table"><thead><tr><th>动作</th><th>组数</th><th>重量</th><th>次数</th></tr></thead><tbody>${s.exercises.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.sets)}</td><td>${esc(e.weight)}</td><td>${esc(e.reps)}</td></tr>`).join('')}</tbody></table></div><p>${esc(s.feedback||'无训练反馈')}</p><p class="field-help">${s.charged?'该记录首次保存时已扣 1 节课。':'该记录未扣课。'}</p><div class="modal-actions">${btn('关闭','closeModal')}${btn('编辑','editSession','primary',`data-id="${s.id}"`)}</div>`)}
function editSession(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;closeModal();state.currentMemberId=s.memberId;state.activeSessionId=s.id;state.drafts[s.memberId]={date:s.date,topic:s.topic,feedback:s.feedback,exercises:structuredClone(s.exercises)};go('training')}
function chooseMember(){openModal('选择会员',`<div class="stack">${state.members.map(m=>`<div class="row"><div class="row-main"><strong>${esc(m.name)}</strong><small>${esc(m.goal)} · 剩余 ${m.lessons} 节</small></div>${btn('选择','selectMember','small primary',`data-id="${m.id}"`)}</div>`).join('')}</div>`)}
function notifications(){const low=state.members.filter(m=>m.lessons<=3);openModal('提醒',`<div class="stack">${allPending().length?`<div class="notice">${allPending().length} 条 AI 建议等待教练确认。</div>`:''}${low.length?`<div class="notice warn">${low.map(m=>`${esc(m.name)} 剩余 ${m.lessons} 节`).join('；')}</div>`:''}${!allPending().length&&!low.length?empty('暂无提醒。'):''}<div class="modal-actions">${btn('查看 AI 建议','go','primary',`data-page="ai"`)}</div></div>`)}
function searchModal(){openModal('搜索会员',`<div class="field"><label for="globalSearch">姓名、电话或训练目标</label><input id="globalSearch" class="input" type="search" placeholder="输入关键词"></div><div id="globalResults">${state.members.map(m=>`<div class="row"><div class="row-main"><strong>${esc(m.name)}</strong><small>${esc(m.goal)}</small></div>${btn('打开','openMember','small',`data-id="${m.id}"`)}</div>`).join('')}</div>`)}
function scheduleAdvice(){const available=state.members.filter(m=>m.status!=='已结课'&&m.lessons>0).sort((a,b)=>a.lessons-b.lessons);openModal('AI 排课建议 · 演示',`<p class="notice">根据当前示例日程与剩余课时生成的本地提示，需由教练决定是否新建预约。</p>${available.length?available.slice(0,3).map(m=>`<div class="row"><div class="row-main"><strong>${esc(m.name)}</strong><small>剩余 ${m.lessons} 节 · ${nextAppointment(m.id)?`下次预约 ${esc(nextAppointment(m.id).date)}`:'暂无后续预约'}</small></div>${btn('为其预约','newAppointment','small primary',`data-id="${m.id}"`)}</div>`).join(''):empty('暂无可排课会员。')}`)}
function resetDemo(){openModal('重置演示数据',`<p>这会清除本机浏览器保存的会员、预约、训练记录和 AI 建议，恢复初始示例。</p><div class="modal-actions">${btn('取消','closeModal')}${btn('确认重置','confirmReset','danger')}</div>`)}
function action(el,e){const a=el.dataset.action,id=el.dataset.id;if(a==='closeBackdrop'){if(el===e.target)closeModal();return}if(a==='closeModal'){closeModal();return}if(a==='go'){closeModal();go(el.dataset.page);return}if(a==='openMember'){closeModal();go('member',id);return}if(a==='openAIFor'){closeModal();go('ai',id);return}if(a==='selectMember'){closeModal();state.currentMemberId=id;state.activeSessionId=null;save();renderShell();return}if(a==='startTraining'){closeModal();startTraining(id,el.dataset.appointment);return}if(a==='newSession'){closeModal();startTraining();return}if(a==='saveTraining'){saveTraining();return}if(a==='generateAI'){generateAI();return}if(a==='confirmAI'){confirmAI(id);return}if(a==='dismissAI'){const s=state.suggestions.find(x=>x.id===id);if(s){s.status='dismissed';save();renderShell();message('建议已忽略。')}return}if(a==='applyPlan'){applyPlan(id);return}if(a==='chooseMember'){chooseMember();return}if(a==='newMember'||a==='editMember'){memberForm(a==='editMember'?id:null);return}if(a==='newAppointment'){if(id&&member(id))state.currentMemberId=id;appointmentForm();return}if(a==='editAppointment'){appointmentForm(id);return}if(a==='completeAppointment'||a==='cancelAppointment'){const x=state.appointments.find(v=>v.id===id);if(x){x.status=a==='completeAppointment'?'completed':'cancelled';save();renderShell();message(a==='completeAppointment'?'预约已标记完成；保存训练时才扣课。':'预约已取消。')}return}if(a==='scheduleView'){state.scheduleView=el.dataset.view;save();renderShell();return}if(a==='addExercise'){syncDraft();draft().exercises.push({name:'',sets:3,weight:'',reps:''});save();renderShell();return}if(a==='removeExercise'){syncDraft();draft().exercises.splice(Number(el.dataset.index),1);save();renderShell();return}if(a==='smartPaste'){syncDraft();smartPaste();return}if(a==='viewSession'){viewSession(id);return}if(a==='editSession'){editSession(id);return}if(a==='exportMembers'){exportMembers();return}if(a==='exportHistory'){exportHistory();return}if(a==='search'){searchModal();return}if(a==='notifications'){notifications();return}if(a==='scheduleAdvice'){scheduleAdvice();return}if(a==='reset'){resetDemo();return}if(a==='confirmReset'){state=seed();save();closeModal();renderShell();message('演示数据已重置。');return}if(a==='logout'){state.loggedIn=false;save();closeModal();renderShell();message('已退出演示账号。');return}if(a==='menu'){openModal('更多操作',`<div class="stack">${btn('训练历史','go','',`data-page="history"`)}${btn('提醒','notifications')}${btn('重置演示','reset')}${btn('退出登录','logout','danger')}</div>`);return}if(a==='trial'){openModal('申请试用 · 演示',`<p>这是单文件本地原型，没有连接真实注册服务。</p><p>可使用页面上的演示账号直接体验教练工作台。</p>${btn('知道了','closeModal','primary')}`);return}}
if (!connectedMode) {
document.getElementById('loginEmail').value = 'coach@example.com';
document.getElementById('loginPassword').value = '123456';
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el,e)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='loginForm'){const ok=document.getElementById('loginEmail').value.trim()==='coach@example.com'&&document.getElementById('loginPassword').value==='123456';document.getElementById('loginError').classList.toggle('hidden',ok);document.getElementById('loginError').textContent=ok?'':'演示账号或密码不正确。';if(ok){state.loggedIn=true;save();renderShell();message('已进入教练工作台演示。')}return}if(f.id==='memberForm'){const id=f.dataset.id,m=id?member(id):null;const values={name:document.getElementById('mName').value.trim(),phone:document.getElementById('mPhone').value.trim(),goal:document.getElementById('mGoal').value.trim(),status:document.getElementById('mStatus').value,lessons:Number(document.getElementById('mLessons').value),totalLessons:Number(document.getElementById('mTotal').value),age:Number(document.getElementById('mAge').value)||null,height:Number(document.getElementById('mHeight').value)||null,weight:Number(document.getElementById('mWeight').value)||null,note:document.getElementById('mNote').value.trim(),attention:document.getElementById('mAttention').value.trim()};if(values.totalLessons<values.lessons){message('总课时不能少于剩余课时。');return}if(m)Object.assign(m,values);else{const fresh={id:uid(),...values};state.members.push(fresh);state.currentMemberId=fresh.id}save();closeModal();go(m?'member':'members');message(m?'会员资料已更新。':'会员已添加。');return}if(f.id==='appointmentForm'){const id=f.dataset.id;const values={memberId:document.getElementById('aMember').value,date:document.getElementById('aDate').value,time:document.getElementById('aTime').value,duration:Number(document.getElementById('aDuration').value),topic:document.getElementById('aTopic').value.trim()};const start=new Date(`${values.date}T${values.time}`),end=new Date(start.getTime()+values.duration*60000);const conflict=state.appointments.some(a=>a.id!==id&&a.status==='scheduled'&&a.date===values.date&&start<new Date(`${a.date}T${a.time}`).getTime()+a.duration*60000&&end>new Date(`${a.date}T${a.time}`));if(conflict){message('预约时间冲突，请换一个时间。');return}const old=state.appointments.find(a=>a.id===id);if(old)Object.assign(old,values);else state.appointments.push({id:uid(),...values,status:'scheduled'});state.scheduleDate=values.date;save();closeModal();go('schedule');message(old?'预约已更新。':'预约已创建。');return}if(f.id==='pasteForm'){const lines=document.getElementById('pasteText').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const parsed=lines.map(line=>{const match=line.match(/^(.+?)\s+(\d+(?:\.\d+)?\s*(?:kg|公斤|lb)?)\s+(\d+)\s*[x×*]\s*(\d+)$/i);return match&&Number(match[3])>=1&&Number(match[3])<=30?{name:match[1].trim(),weight:match[2].replaceAll(' ',''),sets:Number(match[3]),reps:Array(Number(match[3])).fill(match[4]).join('/')}:null});if(!parsed.length||parsed.some(x=>!x)){message('未能解析。请按“动作 65kg 4x8”格式逐行输入。');return}const d=draft();d.exercises=d.exercises.filter(x=>x.name.trim()).concat(parsed);save();closeModal();renderShell();message(`已解析 ${parsed.length} 个动作，可继续编辑。`)}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='memberSearch'){state.memberSearch=el.value;save();const pos=el.selectionStart;renderShell();const next=document.getElementById('memberSearch');next?.focus();next?.setSelectionRange(pos,pos)}else if(el.id==='historySearch'){state.historySearch=el.value;save();const pos=el.selectionStart;renderShell();const next=document.getElementById('historySearch');next?.focus();next?.setSelectionRange(pos,pos)}else if(el.id==='globalSearch'){const q=el.value.trim().toLowerCase();document.getElementById('globalResults').innerHTML=state.members.filter(m=>[m.name,m.phone,m.goal].some(v=>v.toLowerCase().includes(q))).map(m=>`<div class="row"><div class="row-main"><strong>${esc(m.name)}</strong><small>${esc(m.goal)}</small></div>${btn('打开','openMember','small',`data-id="${m.id}"`)}</div>`).join('')||empty('没有找到会员。')}else if(el.closest('#content')&&state.page==='training'){syncDraft()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='memberFilter')state.memberFilter=el.value;else if(el.id==='memberSort')state.memberSort=el.value;else if(el.id==='historyMember')state.historyMember=el.value;else if(el.id==='historyRange')state.historyRange=el.value;else if(el.id==='scheduleDate')state.scheduleDate=el.value;else return;save();renderShell()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderShell();
} else {
  const form = document.getElementById('loginForm');
  const submit = form.querySelector('[type=submit]');
  const notice = document.getElementById('loginError');
  form.querySelector('.muted').textContent = '登录查看会员和训练历史。';
  document.querySelector('.login-visual p').textContent = '查看会员档案与已保存的训练记录。';
  document.querySelector('.login-visual .chiprow:last-child').textContent = '联网模式 · 只读';
  document.getElementById('demoLoginHelp').remove();
  form.querySelector('[data-action=trial]').remove();
  submit.disabled = true;
  form.addEventListener('submit', event => event.preventDefault());
  import('/app/assets/workspace.js')
    .then(({ startWorkspace }) => startWorkspace({ esc, btn, title, empty, openModal, closeModal, navItems }))
    .catch(() => {
      notice.textContent = '无法加载工作台，请刷新页面后重试。';
      notice.classList.remove('hidden');
    });
}
</script>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coach-os"
version = "0.1.0"
description = "A Streamlit operating system for personal fitness coaches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "streamlit>=1.32,<2",
  "supabase>=2,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "ruff>=0.8",
  "pglast>=7,<9",
]

[project.scripts]
ai-coach = "ai_coach_os.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/ai_coach_os/ui/helpers.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

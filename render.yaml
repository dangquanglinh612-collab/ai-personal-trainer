services:
  - type: web
    name: ai-coach-os-pilot
    runtime: python
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -e '.[web]'
    startCommand: AI_COACH_WEB_ORIGIN="$RENDER_EXTERNAL_URL" python -m uvicorn ai_coach_os.web.app:create_app --factory --host 0.0.0.0 --port "$PORT" --workers 1 --no-access-log
    healthCheckPath: /app/
    envVars:
      - key: SUPABASE_URL
        value: https://okrhgaeimqviyqffetka.supabase.co
      - key: SUPABASE_TEST_PROJECT_REF
        value: okrhgaeimqviyqffetka
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ALLOWED_COACH_IDS
        sync: false
